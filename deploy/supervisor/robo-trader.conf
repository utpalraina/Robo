; Supervisor Configuration for Robo Trader
; Professional process management for production deployment

[group:robo-trader]
programs=robo-trader-web,robo-trader-worker
priority=999

[program:robo-trader-web]
; Main web application server
command=/app/venv/bin/gunicorn web.server:app -c /app/deploy/gunicorn.conf.py
directory=/app
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=10
startretries=3
exitcodes=0,2
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

; Logging
stdout_logfile=/var/log/robo-trader/web.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/robo-trader/web-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; Environment
environment=
    PYTHONPATH="/app",
    PYTHONUNBUFFERED="1",
    ENV="production"

[program:robo-trader-worker]
; Background worker for trading operations
command=/app/venv/bin/python -m celery -A workers.celery_app worker --loglevel=info --concurrency=4
directory=/app
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=10
startretries=3
exitcodes=0,2
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

; Logging
stdout_logfile=/var/log/robo-trader/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/robo-trader/worker-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; Environment
environment=
    PYTHONPATH="/app",
    PYTHONUNBUFFERED="1",
    ENV="production"

[program:robo-trader-scheduler]
; Scheduled tasks (model retraining, data fetching)
command=/app/venv/bin/python -m celery -A workers.celery_app beat --loglevel=info
directory=/app
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=10
startretries=3

; Logging
stdout_logfile=/var/log/robo-trader/scheduler.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/robo-trader/scheduler-error.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10

; Environment
environment=
    PYTHONPATH="/app",
    PYTHONUNBUFFERED="1",
    ENV="production"
